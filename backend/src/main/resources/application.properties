
# Application name
spring.application.name=ai-job-agent

# HTTP server
server.port=8080

# Resume upload directory
app.file.upload-dir=uploads/resumes

# Maximum size of a single uploaded file
spring.servlet.multipart.max-file-size=10MB

# Maximum size of an upload request
spring.servlet.multipart.max-request-size=10MB

# ==============================
# MySQL Database
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/ai_job_agent?connectionTimeZone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# ==============================
# Spring Data JPA
# ==============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================================

# ======================================

# ======================================
# Ollama Local AI
# ======================================

spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:4b
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.model.embedding=none

spring.ai.retry.max-attempts=2
logging.level.org.springframework.ai.tool=DEBUG